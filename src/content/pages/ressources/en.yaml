seo:
  title: 'Resources for restaurant owners and networks | Hatch OS'
  description: 'Downloadable templates, guides and a glossary for independent restaurant owners and franchise networks. Free to use, no form and no email required.'

hero:
  kicker: 'Resources'
  titre: 'What restaurant owners actually use, free to access.'
  chapeau: 'Templates, guides and a glossary, whether you run a bistro or a network of 50 restaurants. Read and download everything with no form and no email.'
  filtre: 'Filter the resources'
  filtres:
    tout: 'All'
    independant: 'I run a restaurant'
    reseau: 'I run a network'

action:
  kicker: 'In action'
  titre: 'Two agents, on WhatsApp.'
  robin:
    titre: 'Robin, for independents'
    texte: 'He matches the delivery note with the invoice, finds the gap and prepares the credit note request. You say yes.'
    statut: 'online'
    cta: 'Join the waitlist'
  peep:
    titre: 'Peep, for networks'
    texte: 'He answers your crew from your own procedures, and quotes the document the answer comes from.'
    statut: 'online'
    mention: 'Example on BunBun, a fictional brand'
    messages:
      - qui: equipier
        txt: 'How much goes in the cash float at opening?'
      - qui: peep
        txt: '€150: €100 in 5 and 10 notes, €50 in coins. Count it with your manager before the first customer.'
        source: 'Source: BunBun operations manual, opening the restaurant'
    cta: 'Message Peep on WhatsApp'
    preRempli: 'Hi Peep, how much goes in the cash float at opening?'

modeles:
  kicker: 'Templates'
