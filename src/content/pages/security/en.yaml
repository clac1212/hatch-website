seo:
  title: 'Security & privacy — Hatch OS'
  description: 'Your data stays yours: hosted in Europe, never used to train an AI, accessible only to whom you decide.'
hero:
  kicker: 'Security & privacy'
  title: 'Your data stays yours.'
  lead: 'You decide what Hatch uses and who can access it. Your data stays hosted in Europe, and no AI trains on it.'
  proofs:
    - 'Hosted in Europe'
    - 'No AI training'
    - 'GDPR compliant'
  alts:
    jay: 'Jay, the voxel bird, standing on two servers with a European flag'
    owl: 'Owl in front of a safe closed with a padlock'
    finch: 'Finch stamping a file as approved'
guarantees:
  - kicker: 'Hosting'
    title: 'Hosted in Europe.'
    points:
      - 'Your data and its backups stay in Europe.'
      - 'Encrypted in transit and at rest (TLS, AES-256).'
      - 'Isolated per customer: nothing shared between networks.'
  - kicker: 'Artificial intelligence'
    title: 'No AI trains on your data.'
    points:
      - 'Your content is used to answer you, never to train a model.'
      - 'Zero retention at our model providers.'
      - 'The agents only rely on your documents.'
  - kicker: 'Compliance'
    title: 'GDPR and AI Act, without the jargon.'
    points:
      - 'Access, export and delete your data whenever you want.'
      - 'No AI assesses, scores or ranks a person.'
      - 'DPA and security documentation on request.'
access:
  kicker: 'Access control'
  title: 'Everyone only sees their own scope.'
  points:
    - 'You choose what Hatch uses, source by source. The rest is never shared.'
    - 'Head office sees everything, a site sees its site, a crew member what concerns them.'
    - 'Your teams sign in with your SSO (SAML).'
  screen:
    app: 'Hatch · Access'
    viewing: 'Seen by'
    roles:
      - 'Head office'
      - 'BunBun Lille'
      - 'Crew member'
    states:
      visible: 'Visible'
      perimetre: 'Own scope'
      masque: 'Hidden'
      nonPartage: 'Not shared with Hatch'
    rows:
      - label: 'BunBun manual'
        meta: 'All sheets'
        access: [visible, visible, visible]
      - label: 'Quality audits'
        meta: 'All sites'
        access: [visible, perimetre, masque]
      - label: 'Rotas'
        meta: 'Site teams'
        access: [visible, perimetre, perimetre]
      - label: 'Network figures'
        meta: 'Revenue, footfall'
        access: [visible, masque, masque]
      - label: 'Recipes in testing'
        meta: 'R&D folder'
cta:
  title: 'A question from your IT team?'
  text: 'Security questionnaire, DPA, documentation: we answer with the details.'
