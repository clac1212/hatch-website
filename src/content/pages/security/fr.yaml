seo:
  title: 'Sécurité & confidentialité — Hatch OS'
  description: 'Vos données restent les vôtres : hébergées en Europe, jamais utilisées pour entraîner une IA, accessibles seulement à qui vous décidez.'
hero:
  kicker: 'Sécurité & confidentialité'
  title: 'Vos données restent les vôtres.'
  lead: "Vous décidez de ce que Hatch utilise et de qui y accède. Vos données restent hébergées en Europe, et aucune IA ne s'entraîne dessus."
  proofs:
    - 'Hébergé en Europe'
    - 'Aucun entraînement IA'
    - 'Conforme RGPD'
  alts:
    jay: "Jay, l'oiseau voxel, sur deux serveurs avec un drapeau européen"
    owl: 'Owl devant un coffre-fort fermé par un cadenas'
    finch: 'Finch appose un tampon de validation sur un dossier'
guarantees:
  - kicker: 'Hébergement'
    title: 'Hébergées en Europe.'
    points:
      - 'Vos données et leurs sauvegardes restent en Europe.'
      - 'Chiffrées en transit et au repos (TLS, AES-256).'
      - 'Cloisonnées par client : aucun partage entre réseaux.'
  - kicker: 'Intelligence artificielle'
    title: "Aucune IA ne s'entraîne sur vos données."
    points:
      - 'Vos contenus servent à vous répondre, jamais à entraîner un modèle.'
      - 'Zéro rétention chez nos fournisseurs de modèles.'
      - "Les agents ne s'appuient que sur vos documents."
  - kicker: 'Conformité'
    title: 'RGPD et AI Act, sans jargon.'
    points:
      - 'Accès, export et suppression de vos données quand vous le souhaitez.'
      - "Aucune IA n'évalue, ne note ni ne classe une personne."
      - 'DPA et documentation de sécurité sur demande.'
access:
  kicker: "Contrôle d'accès"
  title: 'Chacun ne voit que son périmètre.'
  points:
    - "Vous choisissez ce que Hatch utilise, source par source. Le reste n'est jamais partagé."
    - 'Le siège voit tout, un site voit son site, un équipier ce qui le concerne.'
    - 'Vos équipes se connectent avec votre SSO (SAML).'
  screen:
    app: 'Hatch · Accès'
    viewing: 'Vu par'
    roles:
      - 'Siège'
      - 'BunBun Lille'
      - 'Équipier'
    states:
      visible: 'Visible'
      perimetre: 'Son périmètre'
      masque: 'Masqué'
      nonPartage: 'Non partagé avec Hatch'
    rows:
      - label: 'Manuel BunBun'
        meta: 'Toutes les fiches'
        access: [visible, visible, visible]
      - label: 'Audits qualité'
        meta: 'Tous les sites'
        access: [visible, perimetre, masque]
      - label: 'Plannings'
        meta: 'Équipes des sites'
        access: [visible, perimetre, perimetre]
      - label: 'Chiffres du réseau'
        meta: "Chiffre d'affaires, fréquentation"
        access: [visible, masque, masque]
      - label: 'Recettes en test'
        meta: 'Dossier R&D'
cta:
  title: 'Une question de votre DSI ?'
  text: 'Questionnaire de sécurité, DPA, documentation : on vous répond avec le détail.'
