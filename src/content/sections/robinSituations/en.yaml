conversation:
  ariaLabel: WhatsApp conversation with Robin (example)
  contact: Robin
  enLigne: online
  ecrit: typing…
  saisie: Message
  rejouer: Replay

situations:
  - titre: He plugs into your tools
    texte: It all happens in WhatsApp. Robin sends you a link, you give him access to your inbox or your Drive, and he finds your invoices and documents on his own.
  - titre: He checks every invoice
    texte: Snap a photo of the delivery note. Robin matches it against the order and the invoice, and shows you the gap. He drafts the credit request, you say yes.
  - titre: He helps you decide
    texte: Ask him a real owner’s question. He cross-checks your sales, your purchases and your staff costs, and answers with the numbers to back it up.
  - titre: He does the prep work
    texte: A voice note is enough. He starts from your templates and your data, sends you the document ready to review, and nothing goes out without your OK.

connexion:
  demande: 'To find your invoices, I need access to your inbox. You can connect it here:'
  lien:
    icone: G
    titre: Connect your inbox
    sousTitre: Secure Hatch OS link
  systeme: Inbox connected
  trouve: "All set ✅ Here's what I found so far:"
  trouvailles:
    - 3 Metro invoices
    - 1 Promocash credit note
    - Food safety plan
    - Temp contract template
  compta: "I'm doing this month's books with these 📊 It'll all be in one Excel file: you give it a look, then send it to Sylvain, your accountant."
  fichier:
    type: XLS
    nom: October books · Le Petit Comptoir.xlsx
    statut: Draft, for you to review

