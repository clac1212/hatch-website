decision:
  question: Is it worth staying open from 2 to 6?
  graphe:
    titre: 14:00–18:00 slot · sales by day
    seuil: staff cost
    jours:
      - { jour: M, ventes: 30, auDessus: false }
      - { jour: T, ventes: 26, auDessus: false }
      - { jour: W, ventes: 36, auDessus: false }
      - { jour: T, ventes: 32, auDessus: false }
      - { jour: F, ventes: 44, auDessus: false }
      - { jour: S, ventes: 82, auDessus: true }
  reponse: On weekdays, that slot doesn't cover wages. Saturdays it does 💪 Close afternoons Monday to Friday?

preparation:
  vocal:
    duree: '0:04'
    transcription: “Do Lina's contract for Saturday night.”
