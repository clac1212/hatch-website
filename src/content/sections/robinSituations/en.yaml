      - { cle: Hours, valeur: '18:00 – 00:00' }
  question: Want me to send it to Lina?
  boutons:
    oui: Send it
    non: I'll check first
  reponse: Send it
  confirmation: Sent to Lina ✅ I'll have her payslip ready at the end of the month.
