  contact: Robin
  enLigne: en ligne
  ecrit: écrit…
  saisie: Message
  rejouer: Rejouer

situations:
  - titre: Il se branche à vos outils
    texte: Tout se passe dans WhatsApp. Robin vous envoie un lien, vous lui ouvrez votre boîte mail ou votre Drive, et il retrouve tout seul vos factures et vos documents.
  - titre: Il vérifie chaque facture
    texte: Prenez le bon de livraison en photo. Robin le rapproche de la commande et de la facture, et vous montre l'écart. Il prépare l'avoir, vous dites oui.
  - titre: Il éclaire vos décisions
    texte: Posez-lui une vraie question de patron. Il croise vos ventes, vos achats et le coût du personnel, et vous répond chiffres en main.
  - titre: Il prépare le travail
    texte: Un vocal suffit. Il part de vos modèles et de vos données, vous envoie le document prêt à relire, et rien ne part sans votre accord.

connexion:
  demande: "Pour retrouver tes factures, il me faut ta boîte mail. Tu peux me l'ouvrir ici :"
  lien:
    icone: G
    titre: Connecter ta boîte mail
    sousTitre: Lien sécurisé Hatch OS
  systeme: Boîte mail connectée
  trouve: "C'est bon ✅ J'ai déjà trouvé :"
  trouvailles:
    - 3 factures Metro
    - 1 avoir Promocash
    - Plan de maîtrise sanitaire
    - Modèle de contrat d'extra
  compta: "Je prépare la compta du mois avec 📊 Tout sera dans un fichier Excel : tu le relis, puis tu l'envoies à Sylvain, ton expert-comptable."
  fichier:
    type: XLS
    nom: Compta octobre · Le Petit Comptoir.xlsx
    statut: Brouillon, à relire

