# Diorama demo: three places on scroll; in each place, the visitor opens an agent's demo.
titre: Your agents at work
consigne: Pick an agent

lieux:
  - surtitre: At head office
    titre: Four agents work alongside your team.
    retour: Back to head office
    agents:
      - cle: peep
        nom: Peep
        role: answers questions from the field
        titre: The field writes, Peep answers.
        carte:
          qui: Crousty One Lille
          texte: Where's the allergen sheet for the new burger?
          reponse:
            qui: Peep
            texte: '“Summer menu allergens” v3, here it is.'
      - cle: lark
        nom: Lark
        role: prepares your morning briefing
        titre: The state of the network, every morning.
        carte:
          lignes:
            - agent: Lark
              texte: 312 answers from Peep this week
            - agent: Lark
              texte: follow up with Lyon Part-Dieu, audit 3 days late
      - cle: jay
        nom: Jay
        role: keeps the manual up to date
        titre: The manual, up to date and shared.
        carte:
          lignes:
            - agent: Jay
              texte: '“Fryer cleaning” v4 shared with 30 sites'
      - cle: finch
        nom: Finch
        role: turns audits into actions
        titre: Audits that turn into action plans.
        carte:
          lignes:
            - agent: Finch
              texte: Lille audit 92 / 100, 2 gaps turned into actions

  - surtitre: In the kitchen
    titre: Teams ask, agents answer.
    retour: Back to the kitchen
    agents:
      - cle: owl
        nom: Owl
        role: answers out loud
        titre: A question out loud, an answer within a minute.
        carte:
          qui: Team · out loud
          texte: '“Owl, how do we open the till?”'
          reponse:
            qui: Owl · on the tablet
            texte: '“Till” sheet, steps 1 to 3, read out loud.'
      - cle: pecker
        nom: Pecker
        role: trains the team during the break
        titre: Training happens during the break.
        carte:
          lignes:
            - agent: Pecker
              texte: '“Opening” module, 5 min, completed by Inès'

  - surtitre: On the build site
    titre: From first contact to opening day.
    retour: Back to the build site
    agents:
      - cle: sparrow-candidats
        nom: Sparrow · Candidates
        role: qualifies your franchise candidates
        titre: Every candidate qualified, right away.
        carte:
          qui: Julien · candidate in Rennes
          texte: Hi, I'm interested in the franchise. How do we start?
          reponse:
            qui: Sparrow
            texte: Glad to hear it! Target city, budget, ideal timing? I'll prepare your file.
      - cle: sparrow-ouverture
        nom: Sparrow · Opening
        role: follows every opening through to day one
        titre: Every opening followed through to day one.
        carte:
          qui: Sparrow
          texte: Are the tiles done? The team training still needs a date.
          reponse:
            qui: Karim · franchisee
            texte: Yes, finished yesterday. Thursday?
