# Diorama demo: three places on scroll; in each place, the visitor opens an agent's demo.
titre: Your agents at work

lieux:
  - surtitre: At head office
    agents:
      - cle: peep
        nom: Peep
        role: answers questions from the field
        titre: The field asks, Peep answers.
        ecran:
          appareil: telephone
          heure: "11:48"
          contact: Peep
          statut: Network assistant
          ecrit: typing…
          jour: Today
          saisie: Message
          fil:
            - de: equipe
              texte: Where's the allergen sheet for the new burger?
            - de: agent
              texte: Here it is, the latest version.
            - document:
                titre: Allergens · summer menu v3
                meta: PDF · 2 pages
            - de: equipe
              texte: Thanks, I'll put it up in the kitchen
          suivi:
            app: Hatch OS
            quand: now
            titre: Head office · field questions
            texte: Peep answered Crousty One Lille
      - cle: lark
        nom: Lark
        role: prepares your morning briefing
        titre: The state of your network, every morning.
        ecran:
          appareil: tableau
          heure: "8:00"
          entete: Lark · Morning briefing
          statut: Monday 8 am
          intro: Good morning Claire, here's the state of the network this morning.
          titre: BunBun network · week 40
          source: Hatch data · last 7 days
          blocs:
            - type: chiffres
              items:
                - valeur: 312
                  libelle: answers from Peep
                - valeur: 28
                  libelle: active sites
                - valeur: 1
                  libelle: overdue audit
            - type: alerte
              texte: Lyon Part-Dieu · audit 3 days overdue
              bouton: Follow up
      - cle: jay
        nom: Jay
        role: keeps the manual up to date
        titre: The manual up to date, and shared.
        ecran:
          appareil: tableau
          heure: "10:15"
          entete: Jay · Manual
          statut: Updated
          intro: I updated the sheet after feedback from Lille.
          titre: Fryer cleaning
          source: BunBun manual · Hygiene sheet
          blocs:
            - type: edition
              version:
                avant: v3
                apres: v4
              lignes:
                - Switch off the fryer, let it cool for 30 min
                - Drain the oil once a week
                - Clean the tank with degreaser
              modifiee: 1
              apres: Drain the oil every three days
            - type: diffusion
              total: 30
              libelle: sites received v4
      - cle: finch
        nom: Finch
        role: turns audits into actions
        titre: Audits that become action plans.
        ecran:
          appareil: tableau
          heure: "17:30"
          entete: Finch · Audits
          statut: Audit done
          intro: Lille audit done, two gaps to fix.
          titre: Quality audit · Lille
          source: BunBun audit grid 2026
          blocs:
            - type: score
              valeur: 92
              sur: 100
              libelle: Overall score
            - type: plan
              reflexion: Writing the action plan…
              titre: Action plan · Lille
              actions:
                - ecart: Fridge temperatures not logged
                  action: Log fridge temperatures morning and evening
                  echeance: From tomorrow
                - ecart: Missing use-by label
                  action: Label every tub at opening
                  echeance: By Friday

  - surtitre: In the kitchen
    agents:
      - cle: owl
        nom: Owl
        role: answers out loud
        titre: A question out loud, the procedure read step by step.
        ecran:
          appareil: tablette
          heure: "15:02"
          entete: Owl · Kitchen tablet
          ecoute: Listening
          prepare: Preparing the sheet
          lit: Reading the sheet
          question: Owl, how do we open the till?
          fiche: Opening the till
          source: BunBun manual · Till sheet v4
          etapes:
            - visuel: code
              texte: Enter your manager code on the screen
              libelle: Manager code
            - visuel: caisse
              texte: Count the cash float, €150
              libelle: Cash float
              billets: [50, 50, 20, 20, 10]
            - visuel: ticket
              texte: Confirm the opening, the receipt prints
              bouton: Confirm opening
              lignes:
                - BunBun · Till 1
                - Opened 15:02
                - Float €150.00
          compteur: Step {n} of {total}
          pied: Read out loud, step by step
      - cle: pecker
        nom: Pecker
        role: trains the team during the break
        titre: Five minutes of training during the break, and head office knows who passed.
        ecran:
          appareil: telephone
          heure: "15:02"
          contact: Pecker
          statut: Training
          ecrit: typing…
          jour: Today
          saisie: Message
          fil:
            - de: agent
              texte: Hi Inès! Today's module, “Opening the restaurant”, 5 min. Shall we?
            - de: equipe
              texte: Let's go
            - quiz:
                question: Before opening the till, you need to…
                aide: Select one answer.
                options:
                  - Switch on the fryer
                  - Count the cash float
                  - Start the music
                bonne: 1
            - de: agent
              texte: Well done, module passed! Next one tomorrow during the break.
          suivi:
            app: Hatch OS
            quand: now
            titre: Head office · training tracker
            texte: Inès passed “Opening the restaurant”

  - surtitre: On the build site
    agents:
      - cle: sparrow-candidats
        nom: Sparrow · Candidates
        role: qualifies your franchise candidates
        titre: Every candidate qualified, without waiting.
        ecran:
          appareil: telephone
          heure: "21:12"
          contact: Sparrow
          statut: BunBun recruitment
          ecrit: typing…
          jour: Today
          saisie: Message
          fil:
            - de: equipe
              texte: Hello, I'm interested in the franchise. How do we start?
            - de: agent
              texte: Glad to hear it! Which city are you aiming for, and when?
            - de: equipe
              texte: Rennes, next spring
            - de: agent
              texte: Perfect, I'm preparing your file. A call with the development team on Thursday?
          suivi:
            app: Hatch OS
            quand: now
            titre: CRM · new candidate
            texte: Julien · Rennes · spring 2027, file ready
      - cle: sparrow-ouverture
        nom: Sparrow · Opening
        role: follows every opening until day one
        titre: Every opening followed until day one.
        ecran:
          appareil: telephone
          heure: "9:05"
          contact: Sparrow
          statut: Rennes opening
          ecrit: typing…
          jour: Today
          saisie: Message
          fil:
            - de: agent
              texte: Hi Karim, are the tiles laid?
            - de: equipe
              texte: Yes, finished yesterday
            - de: agent
              texte: Great. The team training is left, shall we set it for Thursday?
            - de: equipe
              texte: Thursday works
          suivi:
            app: Hatch OS
            quand: now
            titre: Rennes opening · 80%
            texte: Team training scheduled for Thursday
