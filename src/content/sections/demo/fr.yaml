# Démo diorama : trois lieux au scroll ; dans chaque lieu, le visiteur ouvre la démo d'un agent.
titre: Vos agents au travail
consigne: Choisissez un agent

lieux:
  - surtitre: Au siège
    titre: Quatre agents travaillent avec votre équipe.
    retour: Retour au siège
    agents:
      - cle: peep
        nom: Peep
        role: répond aux questions du terrain
        titre: Le terrain écrit, Peep répond.
        carte:
          qui: Crousty One Lille
          texte: Où est la fiche allergènes du nouveau burger ?
          reponse:
            qui: Peep
            texte: Fiche « Allergènes carte été » v3, la voici.
      - cle: lark
        nom: Lark
        role: prépare votre point du matin
        titre: L'état du réseau, chaque matin.
        carte:
          lignes:
            - agent: Lark
              texte: 312 réponses de Peep cette semaine
            - agent: Lark
              texte: relancer Lyon Part-Dieu, audit en retard de 3 jours
      - cle: jay
        nom: Jay
        role: tient le manuel à jour
        titre: Le manuel à jour, et diffusé.
        carte:
          lignes:
            - agent: Jay
              texte: « Nettoyage friteuse » v4 diffusée à 30 sites
      - cle: finch
        nom: Finch
        role: transforme les audits en actions
        titre: Des audits qui deviennent des plans d'action.
        carte:
          lignes:
            - agent: Finch
              texte: audit Lille 92 / 100, 2 écarts transformés en actions

  - surtitre: En cuisine
    titre: Les équipes demandent, les agents répondent.
    retour: Retour à la cuisine
    agents:
      - cle: owl
        nom: Owl
        role: répond à voix haute
        titre: Une question à voix haute, une réponse dans la minute.
        carte:
          qui: Équipe · à voix haute
          texte: « Owl, comment on ouvre la caisse ? »
          reponse:
            qui: Owl · sur la tablette
            texte: Fiche « Caisse », étapes 1 à 3, lue à voix haute.
      - cle: pecker
        nom: Pecker
        role: forme l'équipe pendant la pause
        titre: La formation se fait pendant la pause.
        carte:
          lignes:
            - agent: Pecker
              texte: module « Ouverture », 5 min, validé par Inès

  - surtitre: Sur le chantier
    titre: Du premier contact au jour J.
    retour: Retour au chantier
    agents:
      - cle: sparrow-candidats
        nom: Sparrow · Candidats
        role: qualifie vos candidats franchisés
        titre: Chaque candidat qualifié, sans attendre.
        carte:
          qui: Julien · candidat à Rennes
          texte: Bonjour, la franchise m'intéresse. Comment on démarre ?
          reponse:
            qui: Sparrow
            texte: Avec plaisir ! Ville visée, apport, date souhaitée ? Je prépare votre dossier.
      - cle: sparrow-ouverture
        nom: Sparrow · Ouverture
        role: suit chaque ouverture jusqu'au jour J
        titre: Chaque ouverture suivie jusqu'au jour J.
        carte:
          qui: Sparrow
          texte: Le carrelage est posé ? Il reste la formation de l'équipe à planifier.
          reponse:
            qui: Karim · franchisé
            texte: Oui, terminé hier. On cale ça jeudi ?
