  paragraphes:
    - "L'accueil de la clientèle constitue un moment déterminant de l'expérience proposée par l'enseigne. Le collaborateur veille à adopter, dès l'entrée du client dans l'établissement, une posture d'ouverture conforme aux standards définis par le réseau, et s'assure de sa prise en charge dans un délai n'excédant pas trente secondes."
