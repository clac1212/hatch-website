seo:
  title: "Hatch OS · L'OS des réseaux de franchise"
  description: 'Sept agents IA qui renforcent vos équipes, du siège au terrain : ils répondent à vos établissements, forment, auditent et préparent vos prochaines ouvertures.'
hero:
